  ## Unit and integration test cases

  - Prefer integration/E2E over unit; cover cross-boundary contracts
  - Verify process spawn args, exit codes, SSE event **order and schema**, filesystem side effects
  - Include edge cases (e.g., empty input, invalid IDs, I/O failures)
  - No mocking of internal modules; only mock external dependencies
  - Avoid `if` / `try-catch` inside tests unless explicitly required; prefer table-driven tests

  ## E2E test scenarios

  - At least one primary success flow and one error flow
  - Assert structure/order/fields rather than natural-language text

  ## Considerations

  - No hardcoded values; use config/env variables
  - Avoid over-implementation beyond ticket scope
  - Stabilize non-determinism (timezone, random seeds, timestamps) in tests

  ## Acceptance Criteria

  - **All tests executed with 0 failed** across unit/integration/E2E
  - **Linter: 0 errors, 0 warnings**
  - **TDD proof** available (Red→Green→Refactor evidence)
  - All reviewer comments addressed, or explicitly resolved after consulting the **the user**; resulting tasks are added and completed
  - Documentation updated
  - **the user** has approved completion

  ## References

  - {{Linked tickets / specs and code paths}}

  <review>

  ## Review

  Please list here in full any remarks received from reviewers.
  Any corrections should also be added to the Tasks section at the top.

  </review>
  <working-notes>

  ## Working notes

  Additional notes or requirements.

  - Always organize work into phases. Do not proceed with tasks without proper phase division.
  - Before starting any work not listed in the Tasks section, first add it as a checkbox item under the appropriate phase, then begin the work.
  - No work should be done without being tracked as a task checkbox.

