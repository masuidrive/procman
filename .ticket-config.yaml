# Ticket system configuration
# https://github.com/masuidrive/ticket.sh

# Directory settings
tickets_dir: 'tickets'

# Git settings
default_branch: 'main'
branch_prefix: 'feature/'
repository: 'origin'

# Automatically push changes to remote repository during close command
# Set to false if you want to manually control when to push
auto_push: true

# Automatically delete remote feature branch after closing ticket
# Set to false if you want to keep remote branches for history
delete_remote_on_close: true

# Success messages (leave empty to disable)
# Message displayed after creating a new ticket
new_success_message: |
  Please open this ticket file and fill in all placeholders according to the guidelines in @prompts/masuidrive/new-ticket-guidelines.md.
  You must ensure all phases, tasks, prerequisites, and acceptance criteria are fully defined before assignment.

# Message displayed after starting work on a ticket
start_success_message: |
  Please review the ticket content in current-ticket.md and make any necessary adjustments before beginning work.

# Message displayed after restoring current ticket link
restore_success_message: |
  Restored the current ticket link.

close_success_message: |
  Ticket closed. Verify all acceptance criteria and tests have passed.

# The `default_content` below is expanded into every new ticket file.
# You fills all placeholders before assignment.
default_content: |
  <ticket-info>

  # Ticket Overview

  {{Background, purpose, and goal of this ticket. Include affected systems and impact scope.}}

  ## Prerequisite

  - Dependencies:
      - {Exact module/library names and versions}}
      ...
  - Environment setup:
      - {{Exact setup steps and versions}}
      ...

  ## Overview

  {{Full change description and key specification points the programmer must know.}}

  ## Tasks

  **Rule:** Follow the exact task order defined by the user. Changing order or adding tasks requires main agent/user approval.

  ### Prepare: Context Alignment

  - [ ] Carefully read the `current-ticket.md` file and understand the content of the task.
  - [ ] Review related code (e.g., `{{code path(s)}}`) and specs (e.g., `{{doc path(s)}}`)
  - [ ] Identify target functions/classes (e.g., `{{function/class name}}`)
  - [ ] Review existing relevant tests (e.g., `{{test file path}}`)
  - [ ] Report any unclear points to the user before starting

  ### Phase 1: {{Feature A}}

  # TDD loop is mandatory: Red -> Green -> Refactor

  - [ ] Carefully read the `current-ticket.md` file and understand the content of the task.
  - [ ] **Add/extend integration or E2E test first** to express the next behavior (Red)
  - [ ] Implement the minimal code to pass those tests (Green)
  - [ ] Refactor: deduplicate, rename, generalize via triangulation (Refactor)
  - [ ] Add/update unit tests only for pure logic where useful
  - [ ] Run `./bin/test-integration.sh` (and unit if relevant) → **All executed, 0 failed**
  - [ ] the user review and approval
  - [ ] Commit

  ### Phase 2: {{Feature B}}

  - [ ] Carefully read the `current-ticket.md` file and understand the content of the task.
  - [ ] **Add/extend integration or E2E test first** (Red)
  - [ ] Minimal implementation to pass (Green)
  - [ ] Refactor (Refactor)
  - [ ] Run `./bin/test-integration.sh` (and unit if relevant) → **All executed, 0 failed**
  - [ ] the user review and approval
  - [ ] Commit

  ...

  ### Phase N: {{Feature N}}

  - [ ] Carefully read the `current-ticket.md` file and understand the content of the task.
  - ...
  - [ ] the user review and approval
  - [ ] Commit

  ### QA Phase: Quality Assurance

  - [ ] Run all test suites:
      - `./bin/test-unit.sh` (if applicable), `./bin/test-integration.sh`, and `./bin/test-e2e.sh`
      - **All executed, 0 failed**
  - [ ] Run linter (e.g., `./bin/lint.sh`) → **0 errors, 0 warnings**
  - [ ] Run `./bin/code-review.sh` and update the `## Review` section
  - [ ] Review feedback resolution:
      - Every comment is addressed in code, or
      - If not applied, consult the **the user** and follow their instruction before proceeding
      - Any required changes from this consultation must be added as new Tasks and completed
  - [ ] Update related documentation
  - [ ] **TDD proof:** each implemented behavior shows a Red→Green→Refactor sequence (commits or step logs)
  - [ ] user final approval before closing


