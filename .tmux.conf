##### 基本設定 #############################################################

# マウス操作を有効にする
set -g mouse on

# コピー・モードのキーバインドを vi 風にする（不要なら削除）
setw -g mode-keys vi

##### マウスホイール関連 ####################################################

# ── 1. 通常時に WheelUp で copy-mode に入りつつスクロール ──
bind -n WheelUpPane \
  if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' \
     'send-keys -M' \
     'select-pane -t=; copy-mode -e; send-keys -M'"

# ── 2. 最下部まで WheelDown したら copy-mode を抜ける ──
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ── 3. copy-mode 内のホイールを 1 行ずつにする ──
#    * vi 風テーブル
bind -Tcopy-mode-vi WheelUpPane   send -N1 -X scroll-up
bind -Tcopy-mode-vi WheelDownPane send -N1 -X scroll-down
#    * Emacs 風テーブル（vi 風を使わない場合はこちらだけ残しても可）
bind -Tcopy-mode     WheelUpPane   send -N1 -X scroll-up
bind -Tcopy-mode     WheelDownPane send -N1 -X scroll-down

