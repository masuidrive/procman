name: Debug IPC Boundary Tests

on:
  workflow_dispatch:
  push:
    branches: [ feature/250805-054053-package-publishing ]

jobs:
  debug-ipc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Show system resources before test
        run: |
          echo "========== System Information =========="
          echo "Memory info:"
          free -h
          echo "CPU info:"
          nproc
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "Disk space:"
          df -h
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Test start time: $(date)"
          echo "========================================"

      - name: Run IPC boundary tests with verbose debug output
        run: |
          echo "========== Running IPC Boundary Tests Only =========="
          
          # Run only IPC boundary tests with maximum verbosity
          npx vitest run tests/boundary/ipc-communication-boundary.test.ts \
            --reporter=verbose \
            --no-coverage \
            --run
            
          echo "================================================"
          echo "Test end time: $(date)"
        timeout-minutes: 20

      - name: Show system resources after test
        if: always()
        run: |
          echo "System resources after test:"
          echo "Memory usage:"
          free -h
          echo "Disk usage:"
          df -h
          echo "Running processes:"
          ps aux | head -10