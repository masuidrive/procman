      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Execute Phase 11.2 - Lifecycle E2E Tests
        run: |
          echo "========== Phase 11.2: Lifecycle E2E Tests =========="
          echo "Executing: tests/e2e/cli-commands-lifecycle.e2e.test.ts"
          echo "Expected: 30 tests"
          echo "Start time: $(date)"
          time npx vitest run tests/e2e/cli-commands-lifecycle.e2e.test.ts --reporter=verbose
